<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Galleri — tekstile processer og drømmedråber, Dorte Wahlberg." />
    <title>Galleri — Dorte Wahlberg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <a class="skip-link" href="#main">Spring til indhold</a>

    <div id="site-header-root"></div>

    <main id="main" class="page-main">
      <section class="section section-alt">
        <div class="wrap">
          <h1>Galleri</h1>
          <p class="section-lead">
            Udvalgte fotos fra tekstile processer, drømmedråber og håndværk.

        </div>
      </section>

                  src="images/galleri/gylden-frugtbarhed.jpg"
                  alt="Gylden frugtbarhed — tekstil med metalramme"
                  width="1050"
                  height="1400"
                  loading="lazy"
                  decoding="async"
                />
              </figure>
            </li>
            <li>
              <figure class="gallery-item">
                <img
                  src="images/galleri/oejne-der-ser.jpg"

            <li>
